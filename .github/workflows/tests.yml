name: Tests

# Runs the module's shipped code against a stubbed Foundry: the manifest and the
# entry script agree, the frame's geometry closes on itself, the symbol matching
# behaves, and the visibility rules follow the token's own nameplate.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The module parses
        run: node --check scripts/cameo.js

      - name: Run the tests
        run: node --test tests/*.test.mjs
