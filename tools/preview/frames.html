<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cameo frames</title>
<!-- The module's own stylesheet, so what is on screen here is what Foundry draws. -->
<link rel="stylesheet" href="/styles/cameo.css">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: #121015;
    font: 15px/1.5 system-ui, sans-serif; color: #cfc8d4;
    display: grid; grid-template-columns: 17rem 1fr; gap: 2rem; padding: 2rem;
  }
  h1 { font: 600 1.1rem/1.3 system-ui, sans-serif; margin: 0 0 1rem; letter-spacing: 0.02em; }
  p { color: #8e8798; margin: 0 0 1.4rem; }
  fieldset { border: 1px solid #2e2a34; border-radius: 6px; margin: 0 0 1rem; padding: 0.7rem 0.9rem 0.9rem; }
  legend { color: #8e8798; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 0 0.3rem; }
  label { display: flex; align-items: center; gap: 0.5rem; padding: 0.15rem 0; }
  /* The stage stands in for the board the panel sits over. */
  .stage {
    position: relative; border-radius: 8px; min-height: 40rem;
    background: radial-gradient(120% 90% at 30% 10%, #221c28, #0c0a0f 70%);
    display: flex; align-items: flex-end; padding: 2rem; overflow: auto;
  }
  .measured { position: fixed; right: 2rem; bottom: 1rem; color: #6f6878; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<div>
  <h1>Cameo frames</h1>
  <p>The real <code>scripts/frame.js</code> and <code>scripts/panel.js</code>, with stand-in portraits. No Foundry, no server-side anything.</p>

  <fieldset>
    <legend>Portrait</legend>
    <label><input type="radio" name="ar" value="3/4" checked> Tall, 3:4</label>
    <label><input type="radio" name="ar" value="1/1"> Square</label>
    <label><input type="radio" name="ar" value="4/3"> Wide, 4:3</label>
    <label><input type="radio" name="ar" value="2/3"> Very tall, 2:3</label>
  </fieldset>

  <fieldset>
    <legend>Name</legend>
    <label><input type="radio" name="name" value="" > None</label>
    <label><input type="radio" name="name" value="Ira"> Ira</label>
    <label><input type="radio" name="name" value="Celeste Ngo" checked> Celeste Ngo</label>
    <label><input type="radio" name="name" value="The Keeper of Colma"> The Keeper of Colma</label>
    <label><input type="radio" name="name" value="Archbishop Ambrose Hale of the Lancea Sanctum"> A silly long one</label>
  </fieldset>

  <fieldset>
    <legend>Symbol</legend>
    <label><input type="radio" name="mark" value="1" checked> A stand-in symbol</label>
    <label><input type="radio" name="mark" value=""> None, clean rail</label>
  </fieldset>

  <fieldset>
    <legend>Frame</legend>
    <label><input type="radio" name="band" value="56" checked> Full, band 56</label>
    <label><input type="radio" name="band" value="44"> Short window, band 44</label>
  </fieldset>
</div>

<div class="stage" id="stage"></div>
<div class="measured" id="measured"></div>

<script type="module">
import { FRAME } from "/scripts/frame.js";
import { cameoElement, mount } from "/scripts/panel.js";

/* A stand-in sitter, drawn here rather than shipped: Cameo carries no artwork,
   and the symbols a real table uses are licensed to that table, not to a repo. */
const portrait = (w, h) => "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
     <defs><radialGradient id="g" cx="0.36" cy="0.22" r="0.95">
       <stop offset="0" stop-color="#3a2630"/><stop offset="1" stop-color="#140f14"/></radialGradient></defs>
     <rect width="${w}" height="${h}" fill="url(#g)"/>
     <ellipse cx="${w / 2}" cy="${h * 0.76}" rx="${w * 0.33}" ry="${h * 0.3}" fill="#2a1a22"/>
     <ellipse cx="${w / 2}" cy="${h * 0.36}" rx="${Math.min(w, h) * 0.17}" ry="${Math.min(w, h) * 0.215}" fill="#f0d2b4"/>
     <path d="M${w / 2 - Math.min(w, h) * 0.2} ${h * 0.33} q ${Math.min(w, h) * 0.2} ${-Math.min(w, h) * 0.3} ${Math.min(w, h) * 0.4} 0 z" fill="#150f12"/>
     <rect width="${w}" height="${h}" fill="none" stroke="#000" stroke-opacity="0.5"/>
   </svg>`);

/* A forged rosette, standing in for a clan symbol. White on transparent, which
   is the shape the module's filter expects: it keeps the alpha and throws the
   colour away, so the symbol comes out cast in the frame's own iron. */
const MARK = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="256" height="256">
     <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
       <circle r="13"/>
       <g><path d="M0 -15 C 9 -27, 26 -27, 30 -13"/><path d="M15 0 C 27 9, 27 26, 13 30"/>
          <path d="M0 15 C -9 27, -26 27, -30 13"/><path d="M-15 0 C -27 -9, -27 -26, -13 -30"/></g>
     </g>
     <circle r="4.5" fill="#fff"/>
   </svg>`);

const pick = (group) => document.querySelector(`input[name="${group}"]:checked`).value;
const stage = document.getElementById("stage");
const measured = document.getElementById("measured");
let live = null;

function draw() {
  const [aw, ah] = pick("ar").split("/").map(Number);
  const band = Number(pick("band"));
  const style = band === FRAME.band ? FRAME : { ...FRAME, band, maxWidth: "15rem", maxHeight: "38vh" };
  live?.destroy();
  live = cameoElement(
    { img: portrait(aw * 220, ah * 220), name: pick("name"), mark: pick("mark") ? MARK : null, alt: "A stand-in sitter" },
    style
  );
  mount(live, stage);
  // The frame is generated from a measured box, so the numbers are worth seeing.
  // Read after the portrait loads, not from an animation frame: rAF does not
  // fire in a backgrounded tab and the readout would stay blank.
  const report = () => {
    const svg = live.el.querySelector(".cameo-ironwork");
    measured.textContent =
      `viewBox ${svg.getAttribute("viewBox")} / ${svg.querySelectorAll("path").length} paths` +
      ` / ${svg.querySelectorAll("image").length} symbol layers`;
  };
  const img = live.el.querySelector(".cameo-portrait");
  if (img.complete) report();
  else img.addEventListener("load", report, { once: true });
}

for (const input of document.querySelectorAll("input")) input.addEventListener("change", draw);
draw();
</script>
</body>
</html>
